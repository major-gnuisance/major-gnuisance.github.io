<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>Inaudible sound player</title>
  <style>
    button {
        padding: 2em;
        margin: 1ex;
    }
    body {
        background: #969fa4;
        font-family: sans;
    }

    .card {
        background: #eee;
        padding: 1em;
        margin: 1em;
        display: inline-block;
        border-radius: 1ex;
    }
  </style>
  <script type="module">
    const status = document.getElementById("status")
    const frequencyLabel = document.getElementById("frequencyLabel")
    const frequency = 80 // Hz
    const audioContext = new AudioContext()
    
    const gain = new GainNode(audioContext)
    gain.gain.value = 0.0005
    gain.connect(audioContext.destination)
    
    const oscillator = new OscillatorNode(audioContext)
    oscillator.type = "sine"
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime)
    oscillator.connect(gain)
    oscillator.start()

    function setGain(x) {
        gain.gain.value = x
    }

    function setFrequency(x) {
        const minHz = 1
        const maxHz = 21000
        let freq = minHz * Math.pow(maxHz / minHz, x)
        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime)
        frequencyLabel.innerText = parseFloat(freq.toPrecision(4))
        
    }
    
    function play() {
        audioContext.resume()
        status.innerText = "playing"
    }

    function stop() {
        audioContext.suspend()
        status.innerText = "stopped"
    }

    window.play = play
    window.stop = stop
    window.setGain = setGain
    window.setFrequency = setFrequency
    document.getElementById("gain").value = gain.gain.value
    stop()
    setFrequency(0.3)
  </script>
</head>
<body>
  <article class=card>
    <h1>Inaudible Sound Player</h1>
    <p>Keep those multipoint Bluetooth headphones on their toes!</p>
    <p>Status: <span id=status></span></p>
    <button onclick="play()">▶</button>
    <button onclick="stop()">⏹</button>
    <br>
    Volume <input type="range" id="gain" min="0.0001" max="0.005" step="any" oninput="setGain(this.value)"/> <label id="gainLabel"></label>
    <br>
    Frequency <input type="range" id="frequency" min="0" max="1" step="any" oninput="setFrequency(this.value)"/> <label id="frequencyLabel"></label> Hz
  </article>
</body>

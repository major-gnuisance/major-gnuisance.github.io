<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>Inaudible sound player</title>
  <style>
    button {
        padding: 2em;
        margin: 1ex;
    }
    body {
        background: #969fa4;
        font-family: sans;
    }

    .card {
        background: #eee;
        padding: 1em;
        margin: 1em;
        display: inline-block;
        border-radius: 1ex;
    }

    .wrapper {
        display: grid;
        grid-template-columns: auto 1fr 5ex auto;
        grid-gap: 0 1em;
    }

    input[type="checkbox"] {
        vertical-align: middle;
        width: 7ex;
        height: 7ex;
    }
  </style>
  <script type="module">
    const frequencyLabel = document.getElementById("frequencyLabel")
    const gainLabel = document.getElementById("gainLabel")
    const toRemove = document.querySelectorAll(".toRemove")
    
    const audioContext = new AudioContext()
    
    const gain = new GainNode(audioContext)
    gain.connect(audioContext.destination)
    
    const oscillator = new OscillatorNode(audioContext)
    oscillator.type = "triangle"
    oscillator.connect(gain)
    oscillator.start()

    function setGain(x) {
        const min = -90
        const max = -40
        let db = min + x * (max - min)
        gainLabel.innerText = db.toFixed(1)
        gain.gain.value = 10 ** (db / 20)
    }

    function setFrequency(x) {
        const min = 1
        const max = 21000
        let freq = min * Math.pow(max / min, x)
        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime)
        frequencyLabel.innerText = parseFloat(freq.toPrecision(4))
        
    }
    
    function play() {
        audioContext.resume()
    }

    function stop() {
        audioContext.suspend()
    }

    function deleteTutorial() {
        for (const elem of toRemove) {
            elem.remove()
        }
    }

    function toggle(b) {
        b ? play() : stop()
        deleteTutorial()
    }

    Object.assign(window, {toggle, setGain, setFrequency})

    stop()
    
    for (const input of document.querySelectorAll('input[type="range"]'))
        input.dispatchEvent(new Event("input"))
  </script>
</head>
<body>
  <article class=card>
    <h1>Inaudible Sound Player</h1>
    <p>Keep those multipoint Bluetooth headphones on their toes!</p>
    <p><label for="play">Play</label> <input type="checkbox" autocomplete="off" name="play" id="play" oninput="toggle(this.checked)" switch /> <span class="toRemove">← Turn it on!</span></p>
    <div class="wrapper">
      Volume <input type="range" id="gain" min="0" value="0.1" max="1" step="any" oninput="setGain(this.value)"/> <label id="gainLabel"></label> <span>dB</span>
      Frequency <input type="range" id="frequency" min="0" value="0.2" max="1" step="any" oninput="setFrequency(this.value)"/> <label id="frequencyLabel"></label> <span>Hz</span>
    </div class="wrapper">
  </article>
</body>
